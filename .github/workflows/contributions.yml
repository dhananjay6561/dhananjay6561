name: Refresh profile cards

on:
  schedule:
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/contributions.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: python3 scripts/profile_stats.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add assets README.md
            git diff --cached --quiet && exit 0
            git commit -q -m "refresh profile cards"
            git push && exit 0
            echo "main moved, regenerating the cards on top of it"
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/contributions.py
            python3 scripts/profile_stats.py
          done
          exit 1
